name: 多站4小时轮询保活

on:
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'   # 北京时间每天0/4/8/12/16/20点各跑一次，共6次
      timezone: 'Asia/Shanghai'
  workflow_dispatch:                    # 保留手动测试按钮

permissions:
  contents: write                       # 允许提交空commit用于续期

jobs:
  # 任务一：每4小时访问一次所有站点
  ping-sites:
    runs-on: ubuntu-24.04               # 锁定系统版本，不会弹出Ubuntu迁移提示
    strategy:
      fail-fast: false                  # 单个站失败不影响其他站
      matrix:
        include:
          # 👇👇👇 这里改成你自己的网站，格式照抄，想加几个加几个
          - name: "AlcHosting主机01"
            url: "https://winner.alc.onl/"
          - name: "Aeonfree主机01"
            url: "https://winner.zya.me/"
          - name: "serv00主机博客01"
            url: "https://wengbudao.serv00.net/"
          - name: "serv00主机博客02"
            url: "https://winner.serv00.net/"
          # - name: "其他站点"
          #   url: "https://其他域名/"
          # 👆👆👆 新站复制上面两行往下加就行
    steps:
      - name: 访问「${{ matrix.name }}」
        run: |
          curl -sS -L --max-time 30 -o /dev/null \
            -w "${{ matrix.name }} → HTTP状态码: %{http_code}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" \
            "${{ matrix.url }}"

  # 任务二：公共仓库自动续期（纯系统命令，不依赖任何第三方 Action）
  repo-keepalive:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 超过45天则自动提交一次，防止定时任务被停用
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "距上次提交：$DAYS 天"
          if [ "$DAYS" -ge 45 ]; then
            git commit --allow-empty -m "chore: keepalive $(date -u +%F)"
            git push
            echo "已提交空commit，活跃度已刷新"
          else
            echo "未达45天阈值，本次跳过"
          fi
